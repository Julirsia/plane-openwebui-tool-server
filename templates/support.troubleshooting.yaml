id: support.troubleshooting
display_name: Troubleshooting
title_template: "[{{ product }}][{{ severity }}] {{ short_summary }}"
default_kind_label: kind:troubleshooting
default_priority: high
default_initial_state: Triage
required_sections:
  - customer_context
  - current_summary
  - customer_symptom
  - impact
  - confirmed_facts
  - open_questions
  - suspected_cause
  - next_actions_internal
  - customer_reply_points
optional_sections:
  - environment
  - reproduction
  - attempted_actions
  - resolution
editable_sections:
  - current_summary
  - confirmed_facts
  - open_questions
  - suspected_cause
  - next_actions_internal
  - customer_reply_points
  - resolution
email_modes:
  - acknowledge
  - request_info
  - progress_update
  - resolution
