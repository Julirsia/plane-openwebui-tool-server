id: support.feature_request
display_name: Feature Request
title_template: "[{{ product }}][feature] {{ short_summary }}"
default_kind_label: kind:feature
default_priority: low
default_initial_state: Triage
required_sections:
  - customer_context
  - current_summary
  - customer_symptom
  - impact
  - confirmed_facts
  - open_questions
  - next_actions_internal
  - customer_reply_points
optional_sections:
  - environment
  - resolution
editable_sections:
  - current_summary
  - confirmed_facts
  - open_questions
  - next_actions_internal
  - customer_reply_points
  - resolution
email_modes:
  - acknowledge
  - request_info
  - progress_update
  - resolution
