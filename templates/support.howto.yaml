id: support.howto
display_name: How-To
title_template: "[{{ product }}][howto] {{ short_summary }}"
default_kind_label: kind:howto
default_priority: medium
default_initial_state: Triage
required_sections:
  - customer_context
  - current_summary
  - customer_symptom
  - impact
  - confirmed_facts
  - open_questions
  - next_actions_internal
  - customer_reply_points
optional_sections:
  - environment
  - attempted_actions
  - resolution
editable_sections:
  - current_summary
  - confirmed_facts
  - open_questions
  - next_actions_internal
  - customer_reply_points
  - resolution
email_modes:
  - acknowledge
  - request_info
  - progress_update
  - resolution
